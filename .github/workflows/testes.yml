name: Testes

on:
  pull_request:
  workflow_dispatch:

jobs:
  # Os testes rodam em 2 maquinas ao mesmo tempo (fatias 1/2 e 2/2 da lista, equilibradas por tests/pesos.json).
  fatia:
    name: testes (fatia ${{ matrix.fatia }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false      # uma fatia falhar nao cancela a outra: mostra todas as falhas de uma vez
      matrix:
        fatia: ['1/2', '2/2']
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Instalar navegador do Playwright
        # Falha de rede temporaria (apt nao resolve security.ubuntu.com) derrubava tudo: atualiza a lista e tenta de novo ate 4 vezes
        timeout-minutes: 12
        run: |
          for i in 1 2 3 4; do
            sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=20 || true
            if npx playwright install --with-deps chromium; then exit 0; fi
            echo "Tentativa $i falhou, esperando para tentar de novo..."
            sleep $((i * 20))
          done
          exit 1

      - name: Rodar testes (fatia ${{ matrix.fatia }})
        env:
          TESTES_FATIA: ${{ matrix.fatia }}
        run: npm test

  # Resultado unico com o nome de antes ("testes"): e esse nome que a protecao da branch main espera.
  testes:
    needs: fatia
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Conferir as fatias
        run: |
          echo "Resultado das fatias: ${{ needs.fatia.result }}"
          test "${{ needs.fatia.result }}" = "success"
